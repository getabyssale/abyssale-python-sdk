[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abyssale"
version = "1.0.0"
description = "Official Python SDK for the Abyssale API — image, video and PDF generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Abyssale" }]
keywords = ["abyssale", "banner", "image-generation", "video", "pdf", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://developers.abyssale.com"
Documentation = "https://developers.abyssale.com/sdks/python"
"API Reference" = "https://api-reference.abyssale.com"
Repository = "https://github.com/getabyssale/abyssale-python-sdk"
Issues = "https://github.com/getabyssale/abyssale-python-sdk/issues"
Changelog = "https://github.com/getabyssale/abyssale-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "anyio>=4",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5",
]
# Only needed to regenerate `src/abyssale/_generated.py` — not required to use or test the SDK.
codegen = [
    "datamodel-code-generator>=0.25",
    "PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abyssale"]

[tool.hatch.build.targets.sdist]
include = ["src/abyssale", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
# The generated models are formatted by the code generator, not by us. Reformatting them here
# would make every regeneration produce a diff against itself.
extend-exclude = ["src/abyssale/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/abyssale/_generated.py" = ["ALL"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/abyssale"]

# The generated models are not hand-written and are excluded from strict typing, exactly as
# `generated.ts` is excluded from review in the Node SDK.
[[tool.mypy.overrides]]
module = "abyssale._generated"
ignore_errors = true
